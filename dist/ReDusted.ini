; ReDusted settings

[Display]
; 1 = borderless windowed (also set the game itself to windowed mode)
Borderless=1
; 0 = the monitor the game starts on, 1..N = a specific monitor
Monitor=0
; Window size; 0 = the monitor's native resolution
Width=0
Height=0

[Framerate]
; Frame rate limit; 0 = uncapped
FPSLimit=60
VSync=0
; 1 = run the terrain/water/lava simulation at SimulationHz whatever the frame
; rate. This is what lets the 30 fps cap go without physics running fast.
FixedSimulation=1
; The game's own simulation rate. Below this frame rate the simulation slows
; down, as it always did.
SimulationHz=30
; Only matters with FixedSimulation=0: 1 = lift the 30 fps cap anyway
; (physics WILL run fast).
ForceUnlock=0

[Videos]
; 1 = skip the logo video at startup
SkipIntroLogos=1
; 1 = skip every later video, e.g. the cutscene after choosing a map
SkipCutscenes=1

[Debug]
; Writes ReDusted.log next to this file
Log=1
