; FromDustFix settings

[Display]
; 1 = borderless windowed (also set the game itself to windowed mode)
Borderless=1
; 0 = the monitor the game starts on, 1..N = a specific monitor
Monitor=0
; Window size; 0 = the monitor's native resolution
Width=0
Height=0

[Framerate]
; Frame rate limit once unlocked; 0 = uncapped
FPSLimit=60
VSync=0
; Rate the terrain/water simulation runs at regardless of FPS (the game's own rate)
SimulationHz=30
MaxSimStepsPerFrame=4
; The cap stays at 30 until the simulation fix is in, because unlocking makes
; the physics run fast. 1 = unlock anyway (physics WILL run fast).
ForceUnlock=0

[Debug]
; Writes FromDustFix.log next to this file
Log=1
